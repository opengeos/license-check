[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "opengeos-license-checks"
version = "0.1.0"
description = "Non-executing checker for published Python and npm package artifacts"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = []

[project.scripts]
olc = "olc.cli:main"

[tool.setuptools.packages.find]
include = ["olc*"]

[tool.setuptools.data-files]
"share/opengeos-license-checks" = ["policy/policy.json"]
